name: Create Keystore
on:
  workflow_dispatch:
    inputs:
      password:
        description: "كلمة سر للمفتاح (6 أحرف أو أكثر، إنجليزي)"
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          PASS: ${{ inputs.password }}
        run: |
          keytool -genkeypair -keystore upload-keystore.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=App, O=App, C=SA"
          base64 -w0 upload-keystore.jks > keystore.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            upload-keystore.jks
            keystore.base64.txt
